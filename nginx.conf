# NetbiX_homepage — 정적 사이트 nginx 설정
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 압축(텍스트 자산만)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite 빌드 자산은 파일명에 해시가 있어 안전하게 오래 캐시한다.
    location /option/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # /option 은 Vite SPA(React) — 없는 경로는 클라이언트 라우팅이 처리하도록 index.html 로.
    location /option/ {
        try_files $uri $uri/ /option/index.html;
    }

    # HTML 은 바뀌면 바로 반영되게 캐시 끔.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # 메인 정적 사이트(index/products/about/contact + css/js/image).
    location / {
        try_files $uri $uri/ =404;
    }
}
