# NetbiX_homepage — 정적 홈페이지 단독 컨테이너
#   docker compose up -d --build
#   http://localhost:8080
services:
  netbix-homepage:
    build:
      context: .
      args:
        VERSION: ${VERSION:-1.0.0}
        GIT_SHA: ${GIT_SHA:-}
        BUILD_DATE: ${BUILD_DATE:-}
    image: netbix-homepage:${NETBIX_TAG:-latest}
    container_name: netbix-homepage
    # 호스트 8080 → 컨테이너 80. 다른 서비스(NIT 8888/8890)와 겹치지 않게.
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
